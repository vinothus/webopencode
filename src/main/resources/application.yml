server:
  port: 8080

spring:
  application:
    name: opencode-spring-boot
  jackson:
    default-property-inclusion: non_null
  mvc:
    async:
      # How long a long-running request (a streamed chat turn) may take.
      request-timeout: 600000
  servlet:
    multipart:
      # Audio clips posted to /api/audio/transcribe. These live under
      # spring.servlet.multipart — server.servlet.multipart.* is not a Spring Boot
      # property and is silently ignored, which caps uploads at the 1 MB default.
      max-file-size: 25MB
      max-request-size: 26MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ---------------------------------------------------------------------------
# The OpenCode library. The top-level keys describe the primary provider (the
# OpenCode Zen gateway); `providers` adds/overrides named ones.
# ---------------------------------------------------------------------------
opencode:
  enabled: true
  base-url: https://opencode.ai/zen/v1
  api-key: ""
  default-provider: zen
  default-model: big-pickle

  # Seed for x-opencode-session. It is hashed into the id shape the gateway
  # accepts (ses_ + 26 hex); keep it fixed so the session stays stable across
  # restarts, or leave it blank for a per-instance one.
  stable-session-id: pawwork-opencode-spring

  user-agent: opencode/1.18.31
  client-name: cli-rotated-20261004-1234
  project-name: rotated-20261004-1234

  include-official-tools: true
  force-streaming: true

  max-tokens: 32000
  max-tool-rounds: 12
  tool-result-limit: 4000
  max-repeated-tool-failures: 5

  # Local tool execution. The built-in coding tools (read/glob/grep/write/edit/bash)
  # run inside this JVM; the file tools are confined to the workspace below.
  tools:
    enabled: true
    # Blank => the process working directory, so the app stays portable.
    # Set an absolute path to pin the agent to a specific tree.
    workspace: ""
    # The shell always asks for confirmation unless this is true.
    allow-shell-without-approval: false
    # How long a paused stream waits for the browser's Allow/Deny.
    approval-timeout-seconds: 300
    # Directory of skill sub-directories, each holding a SKILL.md. Blank disables the skill tool.
    skills-dir: /config/Engineering/pawwork-linux/skills
    # How deep the `task` tool may nest sub-agents before refusing.
    max-task-depth: 2

  connect-timeout-seconds: 30
  request-timeout-seconds: 300
  stream-idle-timeout-seconds: 300

  retry:
    max-attempts: 3
    backoff-millis: 1000
    dns-backoff-millis: 1500
    retry-on-transient-http: true

  identity:
    rotate-hourly: true

  providers:
    deepseek:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      default-model: deepseek-chat
      max-tokens: 4096
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      default-model: gpt-5.2
      max-tokens: 4096

# ---------------------------------------------------------------------------
# Local speech-to-text. The engine (sherpa-onnx Whisper) runs inside this JVM:
# the browser sends audio, and the decoding, language detection (English /
# Tamil) and the Whisper inference all happen here, on this machine.
#
# Switch to "remote" to talk to a separate speech-to-text service instead —
# the arrangement for a containerised web app reaching a transcriber on the
# host. The same jar can run as that service:
#   java -Djava.library.path=lib -Dloader.main=com.pawwork.opencode.stt.SttServer \
#        -Dstt.models.dir=./models -cp target/opencode-spring-boot-1.0.0.jar \
#        org.springframework.boot.loader.launch.PropertiesLauncher
# ---------------------------------------------------------------------------
stt:
  mode: embedded
  # Only used when mode=remote.
  base-url: http://127.0.0.1:8092/api/audio
  # Where the Whisper models live, one sub-directory per size.
  models-dir: models
  threads: 8
  default-model: medium
  # Silero voice-activity detection: splits long clips on pauses. Off by default —
  # hard gating can clip soft Tamil plosives.
  vad: false
  # Blank means the copy bundled in the jar (silero_vad.onnx).
  vad-model: ""
  timeout-seconds: 180
  max-bytes: 26214400          # 25 MB of audio per request
