<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Voice Chat — Big Pickle (OpenCode Zen)</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e2230;
    --user: #2563eb;
    --assistant: #262b3b;
    --text: #e7eaf3;
    --muted: #8b93a7;
    --accent: #22d3ee;
    --danger: #ef4444;
    --ok: #22c55e;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #1b2440 0%, var(--bg) 55%);
    color: var(--text);
    height: 100vh;
    height: 100dvh;              /* mobile: don't hide the footer behind browser chrome */
    display: flex; flex-direction: column;
    overscroll-behavior: none;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    background: rgba(23,26,35,.85);
    border-bottom: 1px solid #262b3b;
    backdrop-filter: blur(6px);
  }
  header .logo { font-size: 22px; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  .pill {
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel-2); color: var(--muted); border: 1px solid #2b3147;
  }
  .pill.on { color: var(--ok); border-color: #14532d; }
  .pill.bad { color: var(--danger); border-color: #7f1d1d; }

  #chat {
    flex: 1; overflow-y: auto; padding: 22px 18px 10px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  .msg { max-width: 76%; display: flex; flex-direction: column; gap: 4px; }
  .msg .who { font-size: 11px; color: var(--muted); padding: 0 6px; }
  .msg .bubble {
    padding: 11px 15px; border-radius: var(--radius);
    line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; }
  .msg.assistant .bubble { background: var(--assistant); border-bottom-left-radius: 4px; }
  .msg.assistant .bubble .cursor { display: inline-block; width: 8px; background: var(--accent);
    animation: blink 1s steps(2) infinite; border-radius: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .msg .meta { font-size: 10px; color: var(--muted); padding: 0 6px; }

  #live {
    align-self: center; font-size: 13px; color: var(--accent);
    min-height: 18px; font-style: italic; opacity: .9; padding: 2px 8px;
  }

  .notice {
    align-self: center; max-width: 560px; text-align: center;
    background: #2a2416; border: 1px solid #7c5e14; color: #fcd34d;
    font-size: 12.5px; padding: 10px 16px; border-radius: 10px; line-height: 1.5;
  }
  .notice.hidden { display: none; }

  /* ---- model manager panel ---- */
  #modelsBtn.on { border-color: var(--accent); color: var(--accent); }
  .mpanel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw);
    background: #12151d; border-left: 1px solid #262b3b; z-index: 50;
    transform: translateX(102%); transition: transform .22s ease;
    display: flex; flex-direction: column; box-shadow: -18px 0 40px rgba(0,0,0,.5);
  }
  .mpanel.open { transform: none; }
  .mpanel header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid #262b3b;
  }
  .mpanel header b { font-size: 14px; }
  .mpanel header .x {
    margin-left: auto; cursor: pointer; border: 1px solid #2c3346;
    background: #1a1e29; color: #cbd5e1; border-radius: 8px; padding: 5px 10px; font-size: 13px;
  }
  .mpanel .body { padding: 14px 16px; overflow-y: auto; flex: 1; }
  .mpanel .row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .mpanel .row .name { font-weight: 600; font-size: 13.5px; }
  .mpanel .row .sz { color: #8695ad; font-size: 12px; margin-left: auto; }
  .mcard {
    border: 1px solid #262b3b; border-radius: 10px; padding: 12px;
    margin-bottom: 10px; background: #161a24;
  }
  .mcard.installed { border-color: #1f5136; background: #12201a; }
  .mcard .meta { color: #8695ad; font-size: 12px; margin: 4px 0 10px; }
  .mcard .actions { display: flex; gap: 8px; align-items: center; }
  .mcard button {
    cursor: pointer; border-radius: 8px; padding: 6px 12px; font-size: 12.5px;
    border: 1px solid #2c3346; background: #1a1e29; color: #e6ebf5;
  }
  .mcard button.pri { background: var(--user); border-color: var(--user); color: #fff; }
  .mcard button.danger { border-color: #7f1d1d; color: #fca5a5; }
  .mcard button:disabled { opacity: .45; cursor: not-allowed; }
  .mbar { height: 7px; border-radius: 4px; background: #232838; overflow: hidden; margin: 8px 0 4px; }
  .mbar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#2563eb,#22d3ee); }
  .mpanel .src { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .mpanel .src select {
    flex: 1; background: #1a1e29; color: #e6ebf5; border: 1px solid #2c3346;
    border-radius: 8px; padding: 8px; font-size: 13px;
  }
  .mpanel .note { color: #8695ad; font-size: 12px; line-height: 1.5; margin-top: 6px; }
  .mpanel .err { color: #fca5a5; font-size: 12.5px; margin-top: 8px; }
  @media (max-width: 720px) {
    .mpanel { width: 100vw; }
  }

  footer { padding: 12px 18px 18px; background: rgba(23,26,35,.85); border-top: 1px solid #262b3b; }
  .controls { display: flex; gap: 10px; align-items: center; }

  #micBtn {
    width: 54px; height: 54px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(145deg, #2563eb, #1d4ed8); color: #fff; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .2s; flex-shrink: 0; position: relative;
  }
  #micBtn:hover { transform: scale(1.06); }
  #micBtn.listening { background: linear-gradient(145deg, #ef4444, #b91c1c); animation: pulse 1.2s infinite; }
  #micBtn:disabled { opacity: .4; cursor: not-allowed; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,.55); }
    70% { box-shadow: 0 0 0 16px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }

  #meter { display: flex; gap: 3px; align-items: flex-end; height: 30px; flex-shrink: 0; }
  #meter .bar { width: 4px; background: #2b3147; border-radius: 2px; height: 4px; transition: height .08s linear, background .2s; }
  #meter.live .bar { background: var(--accent); }

  #text { flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid #2b3147;
    border-radius: 12px; padding: 14px 16px; font-size: 15px; outline: none; }
  #text:focus { border-color: var(--user); }
  #sendBtn, .tbtn {
    border: 1px solid #2b3147; background: var(--panel-2); color: var(--text);
    border-radius: 12px; padding: 13px 16px; cursor: pointer; font-size: 15px; transition: background .15s;
  }
  #sendBtn { background: var(--user); border-color: var(--user); }
  #sendBtn:hover, .tbtn:hover { filter: brightness(1.15); }
  #sendBtn:disabled, .tbtn:disabled { opacity: .45; cursor: not-allowed; }
  .tbtn.toggled { border-color: var(--accent); color: var(--accent); }

  #langSel {
    background: var(--panel-2); color: var(--text); border: 1px solid #2b3147;
    border-radius: 12px; padding: 12px 10px; font-size: 14px; cursor: pointer; outline: none;
    max-width: 150px;
  }
  #langSel:focus { border-color: var(--user); }
  #modelSel {
    background: var(--panel-2); color: var(--text); border: 1px solid #2b3147;
    border-radius: 12px; padding: 12px 10px; font-size: 14px; cursor: pointer; outline: none;
    max-width: 190px;
  }
  #modelSel:focus { border-color: var(--user); }

  .statusbar { display: flex; gap: 14px; font-size: 11px; color: var(--muted); padding: 8px 4px 0; flex-wrap: wrap; }
  .statusbar b { color: var(--text); font-weight: 500; }

  /* ------------------------------------------------------- tool approval */
  #approval {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(6,8,14,.72); backdrop-filter: blur(3px); padding: 18px;
  }
  #approval.show { display: flex; }
  #approval .card {
    width: 100%; max-width: 540px; background: var(--panel);
    border: 1px solid #2b3147; border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.55); animation: pop .14s ease-out;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  #approval .head {
    padding: 14px 16px; border-bottom: 1px solid #262b3b; font-weight: 600; font-size: 15px;
    display: flex; align-items: center; gap: 8px;
  }
  #approval .body { padding: 14px 16px; }
  #approval .tool { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  #approval .tool b { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #approval pre {
    margin: 0; padding: 12px; background: #0c0e14; border: 1px solid #262b3b; border-radius: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.5;
    color: var(--text); white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow: auto;
  }
  #approval .warn { margin-top: 10px; font-size: 12px; color: #fbbf24; }
  #approval .foot { padding: 12px 16px 16px; display: flex; gap: 10px; justify-content: flex-end; }
  #approval .foot button {
    padding: 10px 18px; border-radius: 10px; border: 1px solid #2b3147; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  #approval .deny { background: var(--panel-2); color: var(--text); }
  #approval .allow { background: var(--ok); color: #04240f; border-color: #14532d; }
  #approval .allow:hover { filter: brightness(1.08); }
  #approval .deny:hover { border-color: #3a4159; }

  /* ---------------------------------------------------------------- mobile */
  @media (hover: none) {          /* touch: bigger hit targets, no hover zoom */
    #micBtn:hover { transform: none; }
    .tbtn, #sendBtn { -webkit-tap-highlight-color: transparent; }
  }

  @media (max-width: 720px) {
    header { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
    header > div { min-width: 0; }
    header h1 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .sub { display: none; }                    /* reclaim the header line */
    header .spacer { display: none; }                 /* let the pills wrap naturally */
    .pill { font-size: 10px; padding: 3px 8px; }
    #chat { padding: 14px 12px 6px; gap: 10px; }
    .msg { max-width: 88%; }                          /* more room for text */
    .msg .bubble { font-size: 15px; padding: 10px 13px; }
    .notice { max-width: 100%; font-size: 12px; }

    footer {
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
    }
    .controls {
      display: grid;                                  /* reflow: text row, then controls */
      grid-template-columns: 1fr 1fr 1fr 1fr;
      grid-template-areas:
        "input input input input"
        "mic   lang  model tools"
        "meter voice stop  new"
        "send  send  send  send";
      gap: 8px;
      align-items: center;
    }
    #text { grid-area: input; font-size: 16px; padding: 12px 14px; }  /* 16px stops iOS zoom-on-focus */
    #micBtn { grid-area: mic; width: 52px; height: 52px; align-self: center; }
    #meter { grid-area: meter; align-self: center; height: 22px; overflow: hidden; }
    #langSel { grid-area: lang; }
    #modelSel { grid-area: model; }
    #toolModeSel { grid-area: tools; }
    #sendBtn { grid-area: send; }
    #voiceBtn { grid-area: voice; }
    #stopBtn { grid-area: stop; }
    #newBtn { grid-area: new; }
    #langSel, #modelSel, #toolModeSel { max-width: none; width: 100%; font-size: 13px; padding: 10px 8px; }
    .tbtn, #sendBtn { padding: 11px 8px; font-size: 14px; }

    .statusbar { gap: 10px; font-size: 10px; padding: 6px 2px 0; }
    .statusbar span:nth-child(1) { display: none; }   /* session id: not useful on a phone */
  }

  @media (max-width: 380px) {                          /* very small phones */
    #micBtn { width: 46px; height: 46px; font-size: 19px; }
    #meter { display: none; }                          /* meter is the first thing to go */
    .controls {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-areas:
        "input input input"
        "mic   lang  model"
        "tools tools tools"
        "voice stop  send";
    }
    #newBtn { display: none; }
  }
  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: #2b3147; border-radius: 6px; }
</style>
</head>
<body>

<header>
  <span class="logo">🦜</span>
  <div>
    <h1>Voice Chat — Big Pickle</h1>
    <div class="sub">Speech → text on this server (Whisper · English + தமிழ்) · text ⇄ LLM via OpenCode Zen</div>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="sttPill">STT: checking…</span>
  <span class="pill" id="ttsPill">TTS: on</span>
</header>

<div id="chat">
  <div class="notice" id="notice"></div>
</div>
<div id="live"></div>

<footer>
  <div class="controls">
    <button id="micBtn" title="Record and transcribe on the server (English / Tamil)">🎤</button>
    <div id="meter"></div>
    <select id="langSel" title="Language for speech-to-text">
      <option value="auto">🌐 Auto (en / ta)</option>
      <option value="en">🇬🇧 English</option>
      <option value="ta">🇮🇳 தமிழ்</option>
    </select>
    <select id="modelSel" title="Speech-to-text engine: the browser's built-in recognizer, or a local Whisper model">
      <option value="browser">🌐 Browser (Google, free)</option>
      <option value="small">⚡ Small (fastest)</option>
      <option value="medium">⚖️ Medium (balanced)</option>
      <option value="large-v3">🎯 Large v3 (best quality)</option>
    </select>
    <select id="toolModeSel" title="What the AI may do with tools: run them freely, ask you first, or disable them">
      <option value="ask">🛠️ Tools: ask first</option>
      <option value="auto">🛠️ Tools: auto-run</option>
      <option value="off">🛠️ Tools: off</option>
    </select>
    <input id="text" type="text" placeholder="Type a message, or press the mic and speak…" autocomplete="off">
    <button id="sendBtn" title="Send">➤</button>
    <button class="tbtn" id="voiceBtn" title="Toggle spoken replies">🔊</button>
    <button class="tbtn" id="stopBtn" title="Stop speaking / stop recording">⏹</button>
    <button class="tbtn" id="newBtn" title="New conversation">🗑</button>
    <button class="tbtn" id="modelsBtn" title="Manage on-device speech models">📦</button>
  </div>
  <div class="mpanel" id="mpanel" aria-hidden="true">
    <header>
      <b>📦 Speech models</b>
      <span class="pill" id="mdirPill" style="font-size:11px">…</span>
      <span class="x" id="mclose">close ✕</span>
    </header>
    <div class="body">
      <div class="src">
        <label for="msrc" style="font-size:12.5px;color:#8695ad">Download from</label>
        <select id="msrc"></select>
      </div>
      <div id="mlist"></div>
      <div class="note" id="mnote"></div>
      <div class="err" id="merr"></div>
    </div>
  </div>

  <div class="statusbar">
    <span>session: <b id="sessionId"></b></span>
    <span>model: <b>big-pickle</b></span>
    <span>mic: <b id="micStatus">idle</b></span>
    <span>last transcript: <b id="sttStatus">—</b></span>
    <span>tools: <b id="toolsStatus">ask</b></span>
    <span id="hint"></span>
  </div>
</footer>

<script>
"use strict";
/* ------------------------------------------------------------------ state */
const $ = (id) => document.getElementById(id);
const chatEl = $("chat"), liveEl = $("live"), noticeEl = $("notice");

const MAX_RECORD_MS = 30000;      // auto-stop a very long recording
const MIN_RECORD_MS = 400;        // ignore accidental taps
const TARGET_RATE = 16000;        // preferred capture rate (the server resamples anyway)

const state = {
  sessionId: localStorage.getItem("vc.sessionId") || ("web-" + Math.random().toString(36).slice(2, 12)),
  busy: false,           // a chat turn is in flight
  listening: false,      // recording
  sttBusy: false,        // a transcription is in flight
  voiceOn: localStorage.getItem("vc.voiceOn") !== "off",
  language: localStorage.getItem("vc.lang") || "auto",
  model: localStorage.getItem("vc.model") || "medium",
  toolMode: localStorage.getItem("vc.tools") || "ask",
  micStream: null,       // WebRTC MediaStream (kept warm across turns)
  audioCtx: null,
  analyser: null,
  meterData: null,
  processor: null,     // PCM tap (ScriptProcessorNode) active while recording
  pcmChunks: [],       // Float32Array blocks of raw mic samples
  recordStartedAt: 0,
  autoStopTimer: null,
  sttReady: false
};
localStorage.setItem("vc.sessionId", state.sessionId);
$("sessionId").textContent = state.sessionId;

/* --------------------------------------------------------------- speech in
 * The browser only CAPTURES audio: WebRTC getUserMedia() opens the microphone,
 * an AnalyserNode drives the live VU meter, and a WebAudio PCM tap collects
 * raw samples. On stop the samples are packed into a WAV file and POSTed to
 * the server, where the local Whisper model turns them into text (English +
 * Tamil) — no browser speech engine involved. The server parses WAV only,
 * hence the encoder below. */

const AudioCtx = window.AudioContext || window.webkitAudioContext;
const SECURE = window.isSecureContext;

function notice(html) {
  if (!html) { noticeEl.classList.add("hidden"); return; }
  noticeEl.innerHTML = html;
  noticeEl.classList.remove("hidden");
}
if (!SECURE) {
  notice("⚠️ <b>Microphone blocked:</b> this page must be opened over HTTPS or localhost. " +
    "Use <code>http://localhost:8080/voice-chat.html</code> inside this machine, or enable SSL and reload.");
}
if (!AudioCtx) {
  notice((noticeEl.classList.contains("hidden") ? "" : noticeEl.innerHTML + "<br>") +
    "ℹ️ This browser cannot capture audio (Web Audio API missing). You can still type messages below.");
}

/* Float32 PCM chunks → 16-bit mono WAV blob -------------------------------- */
function encodeWav(chunks, sampleRate) {
  let n = 0;
  for (const c of chunks) n += c.length;
  const bytes = n * 2;
  const buf = new ArrayBuffer(44 + bytes);
  const view = new DataView(buf);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  str(0, "RIFF"); view.setUint32(4, 36 + bytes, true); str(8, "WAVE");
  str(12, "fmt "); view.setUint32(16, 16, true);        // fmt chunk size
  view.setUint16(20, 1, true);                          // format: PCM
  view.setUint16(22, 1, true);                          // channels: mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);             // byte rate
  view.setUint16(32, 2, true);                          // block align
  view.setUint16(34, 16, true);                         // bits per sample
  str(36, "data"); view.setUint32(40, bytes, true);
  let off = 44;
  for (const c of chunks) {
    for (let i = 0; i < c.length; i++, off += 2) {
      const s = Math.max(-1, Math.min(1, c[i]));
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
  }
  return new Blob([buf], { type: "audio/wav" });
}

async function ensureMic() {
  if (state.micStream) return state.micStream;
  // Raw fidelity wins for ASR, but `ideal:false` constraint objects can make Chrome select a
  // *different* capture device with no signal — so ask in plain booleans and always fall back
  // to a bare audio:true if the browser rejects the set.
  const wanted = {
    echoCancellation: true,      // required: replies are spoken aloud while the mic is open
    noiseSuppression: false,     // phone-call DSP smears quiet / accented speech
    autoGainControl: false,
    channelCount: 1
  };
  try {
    state.micStream = await navigator.mediaDevices.getUserMedia({ audio: wanted });
  } catch (_) {
    state.micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }
  setStatus("mic", "idle");
  const track = state.micStream.getAudioTracks()[0];
  if (track) {
    const st = track.getSettings ? track.getSettings() : {};
    state.micLabel = (track.label || "default mic") +
      (st.sampleRate ? " · " + st.sampleRate + " Hz" : "");
    $("hint").textContent = state.micLabel;
  }
  try { state.audioCtx = new AudioCtx({ sampleRate: TARGET_RATE }); }
  catch (_) { state.audioCtx = new AudioCtx(); }     // browser rejects the hint
  if (state.audioCtx.state === "suspended") await state.audioCtx.resume();
  state.micSource = state.audioCtx.createMediaStreamSource(state.micStream);
  state.analyser = state.audioCtx.createAnalyser();
  state.analyser.fftSize = 256;
  state.micSource.connect(state.analyser);
  state.meterData = new Uint8Array(state.analyser.frequencyBinCount);
  startMeterLoop();
  return state.micStream;
}

/* VU meter ---------------------------------------------------------------- */
const meterEl = $("meter");
const BARS = 14;
for (let i = 0; i < BARS; i++) {
  const b = document.createElement("div");
  b.className = "bar";
  meterEl.appendChild(b);
}
function startMeterLoop() {
  const bars = meterEl.children;
  const tick = () => {
    if (!state.analyser) return;
    state.analyser.getByteTimeDomainData(state.meterData);
    let peak = 0;
    for (let i = 0; i < state.meterData.length; i++) {
      peak = Math.max(peak, Math.abs(state.meterData[i] - 128) / 128);
    }
    const lit = Math.round(peak * BARS * 1.6);
    for (let i = 0; i < BARS; i++) {
      bars[i].style.height = (i < lit ? 6 + i * 1.8 : 4) + "px";
      bars[i].style.background = (i < lit) ? (i > BARS - 4 ? "#ef4444" : "var(--accent)") : "#2b3147";
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* Recording --------------------------------------------------------------- */
async function startListening() {
  if (state.busy || state.sttBusy || state.listening) return;
  if (state.model === "browser") return startBrowserRecognition();
  if (!AudioCtx) return;
  await startLocalRecording();
}

/* ---- built-in browser engine (Web Speech API / SpeechRecognition) ---------
 * Chrome/Chromium only. Google's engine: excellent accuracy and live interim
 * results, but the audio is sent to Google and it needs network access. When
 * the API or the language is unavailable we fall back to the local service. */
function startBrowserRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    notice("â ï¸ <b>This browser has no built-in speech engine.</b> " +
      "Switching to the local Whisper model.");
    state.model = "medium";
    localStorage.setItem("vc.model", state.model);
    $("modelSel").value = state.model;
    return startLocalRecording();
  }
  const rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  const want = state.language;
  rec.lang = want === "ta" ? "ta-IN" : want === "en" ? "en-IN" : (navigator.language || "en-US");
  state.recognizer = rec;
  state.browserFinal = "";
  state.listening = true;
  state.recordStartedAt = Date.now();
  $("micBtn").classList.add("listening");
  $("micBtn").textContent = "â¬";
  meterEl.classList.add("live");
  setStatus("mic", "recording… (browser)");
  liveEl.textContent = "ð recording with the browser engine â tap the mic to stop";

  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) state.browserFinal += t + " ";
      else interim += t;
    }
    state.browserInterim = interim;
    liveEl.textContent = "ð " + (state.browserFinal + interim).trim();
  };
  rec.onerror = (ev) => {
    state.browserError = ev.error || "error";
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      notice("â ï¸ <b>Microphone permission denied for the browser engine.</b>");
    }
    stopListening(false);
  };
  rec.onend = () => { if (state.listening) stopListening(false); };
  try { rec.start(); }
  catch (e) { state.browserError = String(e); stopListening(false); }

  clearTimeout(state.autoStopTimer);
  state.autoStopTimer = setTimeout(() => stopListening(false), MAX_RECORD_MS);
}

async function startLocalRecording() {
  try { await ensureMic(); }
  catch (e) {
    setStatus("mic", "unavailable");
    notice("⚠️ <b>No microphone available.</b> " + (SECURE
      ? "Check your system's audio input devices and browser permissions."
      : "The microphone requires a secure context (HTTPS/localhost)."));
    return;
  }
  stopSpeaking();
  notice("");

  const ctx = state.audioCtx;
  if (!ctx || !ctx.createScriptProcessor) {
    setStatus("mic", "unavailable");
    notice("⚠️ <b>Recording not supported</b> (Web Audio API missing). Type your message instead.");
    return;
  }
  if (ctx.state === "suspended") { try { await ctx.resume(); } catch (_) { /* ignore */ } }

  // One source node for the whole session; the analyser (meter) lives on it already.
  // The recorder tap hangs off the SAME node so the graph stays connected.
  state.pcmChunks = [];
  const tapSrc = state.micSource || ctx.createMediaStreamSource(state.micStream);
  state.micSource = tapSrc;

  const proc = ctx.createScriptProcessor(4096, 1, 1);
  proc.onaudioprocess = (ev) => {
    if (!state.listening) return;
    const input = ev.inputBuffer.getChannelData(0);
    const copy = new Float32Array(input.length);
    copy.set(input);                                   // copy: the buffer is reused
    state.pcmChunks.push(copy);
  };
  // Chrome only pumps onaudioprocess while the node has a live path to the destination.
  // A muted gain node still counts as live; gain=0.0001 keeps the graph running silently
  // without muting the node itself.
  const sink = ctx.createGain();
  sink.gain.value = 0.0001;
  tapSrc.connect(proc);
  proc.connect(sink);
  sink.connect(ctx.destination);
  state.processor = { proc, sink, src: null };   // src is shared, don't disconnect it

  state.listening = true;
  state.recordStartedAt = Date.now();
  $("micBtn").classList.add("listening");
  $("micBtn").textContent = "⬛";
  meterEl.classList.add("live");
  setStatus("mic", "recording…");
  liveEl.textContent = "🎙 recording — tap the mic to stop";
  clearTimeout(state.autoStopTimer);
  state.autoStopTimer = setTimeout(() => stopListening(false), MAX_RECORD_MS);
}

function stopListening(silent) {
  clearTimeout(state.autoStopTimer);
  state.autoStopTimer = null;
  if (!state.listening) {
    if (!silent) liveEl.textContent = "";
    return;
  }
  // browser engine: stop the recognizer and use whatever it has already produced
  if (state.recognizer) {
    const rec = state.recognizer;
    state.recognizer = null;
    state.listening = false;
    $("micBtn").classList.remove("listening");
    $("micBtn").textContent = "ð¤";
    meterEl.classList.remove("live");
    try { rec.onend = null; rec.onerror = null; rec.stop(); } catch (_) {}
    const text = (state.browserFinal || "").trim();
    const err = state.browserError; state.browserError = null;
    state.browserFinal = ""; state.browserInterim = "";
    if (silent === true) { liveEl.textContent = ""; return; }
    if (err === "no-speech" || (!text && !err)) {
      liveEl.textContent = "";
      notice("ð¤« The browser engine heard no speech in that clip.");
      return;
    }
    if (err === "network") {
      liveEl.textContent = "";
      notice("â ï¸ <b>The browser engine needs internet access to Google.</b> " +
        "Pick a local model instead, or check the connection.");
      return;
    }
    if (!text) { liveEl.textContent = ""; return; }
    liveEl.textContent = "ð " + text;
    setStatus("stt", "browser Â· " + (state.language === "auto" ? "auto" : state.language));
    send(text);
    return;
  }
  state.listening = false;
  const tap = state.processor;
  state.processor = null;
  const tooShort = Date.now() - state.recordStartedAt < MIN_RECORD_MS;
  try {
    if (tap) {
      tap.proc.onaudioprocess = null;
      if (tap.src) tap.src.disconnect();
      tap.proc.disconnect(); tap.sink.disconnect();
    }
  } catch (_) { /* already disconnected */ }
  $("micBtn").classList.remove("listening");
  $("micBtn").textContent = "🎤";
  meterEl.classList.remove("live");
  if (silent === true) { state.pcmChunks = []; return; }
  if (tooShort) { setStatus("mic", "idle"); liveEl.textContent = ""; return; }
  setStatus("mic", "transcribing…");
  finishRecording();
}

/* The WAV goes to the server; the local Whisper model returns the text. */
async function transcribe(blob) {
  const form = new FormData();
  form.append("audio", blob, "utterance.wav");
  form.append("language", state.language);
  form.append("model", state.model);

  const resp = await fetch("/api/audio/transcribe", { method: "POST", body: form });
  let data = null;
  try { data = await resp.json(); } catch (_) { /* non-JSON body */ }
  if (!resp.ok || !data || data.ok !== true) {
    throw new Error((data && data.error) ? data.error : ("HTTP " + resp.status));
  }
  return data;
}

async function finishRecording() {
  const chunks = state.pcmChunks;
  state.pcmChunks = [];
  const rate = (state.audioCtx && state.audioCtx.sampleRate) || TARGET_RATE;
  const blob = chunks.length ? encodeWav(chunks, rate) : null;
  if (!blob || !blob.size) {
    if (!state.busy) { setStatus("mic", "idle"); liveEl.textContent = ""; }
    return;
  }

  // Did the browser actually capture any signal? If every sample is (near) zero the
  // problem is local (mic/graph), not the model — say so instead of blaming the server.
  let peak = 0;
  for (const c of chunks) {
    for (let i = 0; i < c.length; i++) peak = Math.max(peak, Math.abs(c[i]));
  }
  if (peak < 0.002) {
    setStatus("mic", "idle");
    liveEl.textContent = "";
    notice("⚠️ <b>Your microphone produced no signal</b> while recording" +
      (state.micLabel ? " (" + state.micLabel + ")" : "") +
      ". Check the input device/volume, then try again.");
    setControls(false);
    return;
  }

  state.sttBusy = true;
  // Disable the controls without touching state.busy: send() must stay allowed.
  setControls(true);
  liveEl.textContent = "🧠 transcribing on the server… (peak " + peak.toFixed(2) + ")";
  try {
    const data = await transcribe(blob);
    const lang = data.language || "?";
    const conf = typeof data.language_probability === "number" ? data.language_probability.toFixed(2) : "";
    setStatus("stt", (data.model || state.model) + " · " + lang + (conf ? " · " + conf : "") + " · " + (data.elapsed_ms || 0) + " ms");
    if (!data.text) {
      liveEl.textContent = "";
      notice("🤫 The server heard no speech in that clip.");
      return;
    }
    liveEl.textContent = "📝 " + data.text;
    setTimeout(() => { if (liveEl.textContent.startsWith("📝")) liveEl.textContent = ""; }, 6000);
    await send(data.text);
    return;
  } catch (e) {
    liveEl.textContent = "";
    notice("⚠️ <b>Transcription failed:</b> " + (e && e.message ? e.message : e) +
      "<br>Is the server-side speech-to-text service up? <code>/api/audio/health</code>");
  } finally {
    state.sttBusy = false;
    if (!state.busy) { setControls(false); setStatus("mic", "idle"); }
  }
}

/* ------------------------------------------------------------------ speech out
 * Replies are spoken with the Web Speech API's speechSynthesis (output only —
 * understanding happens on the server). */
const synth = window.speechSynthesis;
function pickVoice(forText) {
  const voices = synth ? synth.getVoices() : [];
  const tamil = /[஀-௿]/.test(forText || "");
  if (tamil) {
    const ta = voices.find(v => /^ta/i.test(v.lang));
    if (ta) return ta;
  }
  return voices.find(v => /en[-_]US/i.test(v.lang) && v.localService) ||
         voices.find(v => /^en/i.test(v.lang)) || voices[0] || null;
}
function speak(text) {
  if (!state.voiceOn || !synth || !text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(text);
  if (v) u.voice = v;
  u.lang = (v && v.lang) || (/[஀-௿]/.test(text) ? "ta-IN" : "en-US");
  u.rate = 1.02; u.pitch = 1.0;
  u.onstart = () => setStatus("mic", "speaking…");
  u.onend = () => setStatus("mic", "idle");
  synth.speak(u);
}
function stopSpeaking() { if (synth) synth.cancel(); }
if (synth) synth.onvoiceschanged = () => {};   // warm the voice list

/* Ask the user whether a tool call may run. Resolves true (allow) or false (deny). */
function askToolApproval(name, argumentsRaw) {
  return new Promise((resolve) => {
    const box = $("approval");
    $("approvalTool").textContent = name;
    $("approvalWarn").textContent = name === "bash"
      ? "\u26a0\ufe0f This runs a shell command on the server, as the application's user. Review it carefully."
      : "";
    let pretty = String(argumentsRaw || "");
    try { pretty = JSON.stringify(JSON.parse(pretty), null, 2); } catch (_) { /* keep raw */ }
    $("approvalArgs").textContent = pretty || "(no arguments)";
    box.classList.add("show");

    const finish = (allow) => {
      box.classList.remove("show");
      $("approvalAllow").removeEventListener("click", onAllow);
      $("approvalDeny").removeEventListener("click", onDeny);
      document.removeEventListener("keydown", onKey);
      resolve(allow);
    };
    const onAllow = () => finish(true);
    const onDeny = () => finish(false);
    const onKey = (e) => { if (e.key === "Escape") finish(false); };

    $("approvalAllow").addEventListener("click", onAllow);
    $("approvalDeny").addEventListener("click", onDeny);
    document.addEventListener("keydown", onKey);
    $("approvalAllow").focus();
  });
}

function addBubble(role, text) {
  const wrap = document.createElement("div");

/* ------------------------------------------------------------------ backend */
async function send(message) {
  if (!message || state.busy) return;
  stopSpeaking();
  stopListening(true);
  setBusy(true);
  addBubble("user", message);
  const bubble = addBubble("assistant", "");
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  cursor.innerHTML = "&nbsp;";
  bubble.appendChild(cursor);
  setStatus("mic", "thinking…");

  let reply = "", rounds = 0;
  try {
    const resp = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: state.sessionId, message, model: "big-pickle", toolMode: state.toolMode })
    });
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let ev = "message", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) ev = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        let payload;
        try { payload = JSON.parse(data); } catch (_) { continue; }
        if (ev === "token" && payload.text) {
          reply += payload.text;
          bubble.textContent = reply;
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (ev === "round") {
          rounds = payload.round;
        } else if (ev === "tool_start") {
          bubble.textContent = reply + "\n🔧 " + payload.name + " " + String(payload.arguments || "").slice(0, 120);
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (ev === "tool_approval") {
          const decision = await askToolApproval(payload.name, payload.arguments);
          try {
            await fetch("/api/tool-approval", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: payload.id, allow: decision })
            });
          } catch (_) { /* the turn will time out and deny on its own */ }
          bubble.textContent = reply + (decision ? "\n🔧 " + payload.name + " (allowed)" : "\n⛔ " + payload.name + " (denied)");
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (ev === "tool_approval_timeout") {
          bubble.textContent = reply + "\n⏱️ tool approval timed out — call denied";
        } else if (ev === "tool_result") {
          let line = "\n🔧 " + payload.name + (payload.success ? " ✓" : " ✗");
          // todowrite: show the plan itself, since that is the useful part.
          if (payload.name === "todowrite" && payload.success) {
            try {
              const t = JSON.parse(payload.result);
              if (Array.isArray(t.todos) && t.todos.length) {
                const mark = { in_progress: "▶", completed: "✔", cancelled: "✖", pending: "•" };
                line += "\n" + t.todos.map(x =>
                  "   " + (mark[x.status] || "•") + " " + x.content
                  + "  [" + x.status + "/" + x.priority + "]").join("\n");
              }
            } catch (_) { /* show just the header */ }
          }
          bubble.textContent = reply + line;
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (ev === "done") {
          reply = payload.reply || reply;
          rounds = payload.rounds || rounds;
          bubble.textContent = reply;
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = (rounds ? rounds + " round(s) · " : "") +
            (payload.usage ? payload.usage.total_tokens + " tokens" : "");
          bubble.parentElement.appendChild(meta);
        } else if (ev === "error") {
          throw new Error(payload.message || "stream error");
        }
      }
    }
    if (!reply) bubble.textContent = "(no reply)";
    speak(reply);
  } catch (e) {
    bubble.textContent = "⚠️ " + (e && e.message ? e.message : e);
    bubble.parentElement.style.filter = "hue-rotate(120deg)";
  } finally {
    cursor.remove();
    setBusy(false);
    setStatus("mic", "idle");
    chatEl.scrollTop = chatEl.scrollHeight;
  }
}

async function loadHistory() {
  try {

}

    const resp = await fetch("/api/audio/health");

    if (!resp.ok || !data.ok) throw new Error(data && data.error ? data.error : "HTTP " + resp.status);
    state.sttReady = true;
    const langs = (data.languages || []).join("+").toUpperCase();
    const nModels = (data.models || []).length;
    const srOk = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    pill.textContent = "STT: " + langs + (nModels ? " · " + nModels + " models" : "") + (srOk ? " + browser" : "") +
      (data.status && data.status !== "ready" ? " (" + data.status + ")" : "");
    syncModelSel(data);
    pill.classList.toggle("on", data.status === "ready");
    pill.classList.toggle("bad", data.status === "error");
    if (data.status && data.status !== "ready") setTimeout(checkStt, 5000);
  } catch (e) {
    state.sttReady = false;
    pill.textContent = "STT: offline";
    pill.classList.add("bad");
    pill.classList.remove("on");
    $("hint").textContent = "speech-to-text service is offline";
  }
}

/* Keep the model dropdown in sync with what the STT server offers. */
function syncModelSel(data) {
  const sel = $("modelSel");
  const offered = data.models || [];
  for (const opt of Array.from(sel.options)) {
    if (opt.value === "browser") { opt.hidden = false; opt.disabled = false; continue; }
    const missing = offered.length > 0 && !offered.includes(opt.value);
    opt.hidden = missing;
    opt.disabled = missing;
  }
  if (state.model !== "browser" && offered.length && !offered.includes(state.model)) {
    state.model = offered.includes(data.default_model) ? data.default_model : offered[0];
    localStorage.setItem("vc.model", state.model);
  }
  sel.value = state.model;
}

function fmtBytes(n) {
  if (!n && n !== 0) return "";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(v >= 10 || i === 0 ? 0 : 1) + " " + u[i];
}

function closeModels() {
  $("mpanel").classList.remove("open");
  $("mpanel").setAttribute("aria-hidden", "true");
  $("modelsBtn").classList.remove("on");
  stopProgressPoll();
}

async function loadModels() {
  $("merr").textContent = "";
  try {
    const resp = await fetch("/api/models");
    const d = await resp.json();
    if (!resp.ok || !d.ok) throw new Error(d.error || ("HTTP " + resp.status));

    // sources dropdown (built once)
    const src = $("msrc");
    if (!src.options.length) {
      for (const s of (d.sources || [])) {
        const o = document.createElement("option");
        o.value = s.id; o.textContent = s.label;
        if (s.id === "upload") { o.disabled = true; o.textContent += " (use the folder below)"; }
        src.appendChild(o);
      }
    }
    $("mdirPill").textContent = fmtBytes(d.freeBytes) + " free";

    const inst = {};
    for (const m of (d.installed || [])) inst[m.name] = m;
    const list = $("mlist");
    list.innerHTML = "";
    for (const a of (d.available || [])) {
      const has = a.installed || !!inst[a.name];
      const card = document.createElement("div");
      card.className = "mcard" + (has ? " installed" : "");
      const size = has && inst[a.name] ? fmtBytes(inst[a.name].bytes) : fmtBytes(a.installedBytes);
      card.innerHTML =
        '<div class="row"><span class="name">' + a.name + (has ? " ✅" : "") + '</span>' +
        '<span class="sz">' + size + (has ? " installed" : " · " + fmtBytes(a.archiveBytes) + " download") + '</span></div>' +
        '<div class="meta">' + (a.dir || "") + '</div>' +
        '<div class="actions"></div>' +
        '<div class="mbar" style="display:none"><i></i></div>' +
        '<div class="meta prog" style="display:none"></div>';
      const actions = card.querySelector(".actions");
      if (has) {
        const del = document.createElement("button");
        del.className = "danger";
        del.textContent = "Delete";
        del.onclick = () => deleteModel(a.name);
        actions.appendChild(del);
        const use = document.createElement("button");
        use.textContent = "Use";
        use.onclick = () => { $("modelSel").value = a.name; state.model = a.name;
                              $("modelSel").dispatchEvent(new Event("change")); closeModels(); };
        actions.appendChild(use);
      } else {
        const dl = document.createElement("button");
        dl.className = "pri";
        dl.textContent = "Download";
        dl.disabled = !a.fits;
        dl.onclick = () => downloadModel(a.name, card);
        actions.appendChild(dl);
        if (!a.fits) {
          const warn = document.createElement("span");
          warn.className = "meta";
          warn.textContent = "needs more free disk";
          actions.appendChild(warn);
        }
      }
      list.appendChild(card);
    }
    $("mnote").innerHTML = "Models install into <code>" + (d.modelsDir || "") +
      "</code>. A 3 GB <code>large-v3</code> is optional — the app runs fine with just one model.";
  } catch (e) {
    $("merr").textContent = "Could not load models: " + e.message;
    $("mdirPill").textContent = "offline";
  }
}

async function downloadModel(name, card) {
  $("merr").textContent = "";
  card.querySelector(".actions button").disabled = true;
  const bar = card.querySelector(".mbar"), fill = bar.querySelector("i"),
        prog = card.querySelector(".prog");
  bar.style.display = "block"; prog.style.display = "block";
  prog.textContent = "starting…";
  const source = $("msrc").value || "github";
  try {
    const resp = await fetch("/api/models/download?model=" + encodeURIComponent(name) +
                             "&source=" + encodeURIComponent(source),
                             { method: "POST" });
    const d = await resp.json();
    if (!resp.ok || !d.ok) throw new Error(d.error || ("HTTP " + resp.status));
    startProgressPoll();
  } catch (e) {
    $("merr").textContent = "Download failed: " + e.message;
    prog.textContent = "";
    bar.style.display = "none";
    card.querySelector(".actions button").disabled = false;
  }
}

async function deleteModel(name) {
  if (!confirm("Delete the '" + name + "' model from disk?")) return;
  $("merr").textContent = "";
  try {
    const resp = await fetch("/api/models/delete?model=" + encodeURIComponent(name),
                             { method: "POST" });
    const d = await resp.json();
    if (!resp.ok || !d.ok) throw new Error(d.error || ("HTTP " + resp.status));
    notice("🗑 Removed <b>" + name + "</b> — freed " + fmtBytes(d.freedBytes) + ".");
    setTimeout(() => notice(""), 3000);
    await loadModels();
    checkStt();
  } catch (e) {
    $("merr").textContent = "Delete failed: " + e.message;
  }
}

function startProgressPoll() {
  if (mPoll) return;
  mPoll = setInterval(async () => {
    try {
      const d = await (await fetch("/api/models/progress")).json();
      const cards = Array.from(document.querySelectorAll("#mlist .mcard"));
      for (const card of cards) {
        const nm = card.querySelector(".name").textContent.replace(/ ✅$/, "").trim();
        const active = d.model === nm &&
          (d.phase === "downloading" || d.phase === "extracting");
        const bar = card.querySelector(".mbar"), fill = bar.querySelector("i"),
              prog = card.querySelector(".prog");
        if (active) {
          bar.style.display = "block"; prog.style.display = "block";
          fill.style.width = (d.percent || 0) + "%";
          prog.textContent = d.phase + " · " + fmtBytes(d.received) + " / " + fmtBytes(d.total) +
            " · " + (d.percent || 0) + "%";
        }
      }
      if (d.phase === "done") {
        stopProgressPoll();
        notice("✅ Installed <b>" + d.model + "</b> — ready to use.");
        setTimeout(() => notice(""), 3000);
        await loadModels(); checkStt();
      } else if (d.phase === "error") {
        stopProgressPoll();
        $("merr").textContent = "Download failed: " + (d.error || "unknown error");
      }
    } catch (_) { /* keep polling */ }
  }, 1500);
}
function stopProgressPoll() { if (mPoll) { clearInterval(mPoll); mPoll = null; } }

$("modelsBtn").addEventListener("click", () => {
  $("mpanel").classList.contains("open") ? closeModels() : openModels();
});
$("mclose").addEventListener("click", closeModels);
checkStt();
setInterval(checkStt, 30000);
loadHistory();
addBubble("assistant", "Hi! Press 🎤 and speak — your words are transcribed on this server "
  + "(English or தமிழ், pick a language above) and then sent to the model. Replies can be spoken back.");
</script>

  <div class="card">
    <div class="head">🛠️ <span id="approvalTitle">Tool permission</span></div>
    <div class="body">
      <div class="tool">The AI wants to run <b id="approvalTool">—</b></div>
      <pre id="approvalArgs"></pre>
      <div class="warn" id="approvalWarn"></div>
    </div>
    <div class="foot">
      <button class="deny" id="approvalDeny">Deny</button>
      <button class="allow" id="approvalAllow">Allow</button>
    </div>
  </div>
</div>
</body>
